name: Build OpenDevEd image

on:
    push:
        branches:
            - feat/google-oidc-sso
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/opendeved/solidtime

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Check out code
              uses: actions/checkout@v7

            - name: Prepare production environment
              run: |
                  cp .env.production .env
                  sed -i "s/APP_BUILD=0/APP_BUILD=${GITHUB_SHA::8}/" .env

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  extensions: mbstring, dom, fileinfo, pgsql
                  coverage: none

            - name: Install production PHP dependencies
              run: composer install --no-dev --no-ansi --no-interaction --prefer-dist --classmap-authoritative

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '20.x'

            - name: Build frontend assets
              run: |
                  npm ci
                  npm run build

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v4.5.2
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and publish image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/prod/Dockerfile
                  build-args: |
                      APP_ENV=production
                      DOCKER_FILES_BASE_PATH=docker/prod/
                  platforms: linux/amd64
                  push: true
                  tags: |
                      ${{ env.IMAGE }}:${{ github.sha }}
                      ${{ env.IMAGE }}:google-oidc-sso
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
